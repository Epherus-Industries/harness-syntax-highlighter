name: 📦 Version And Publish Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version and create tag
        run: |
          NEW_VERSION=$(npm version patch -m "chore(release): v%s [skip ci]")
          echo "NEW_VERSION=${NEW_VERSION#v}" >> "$GITHUB_ENV"
          echo "Bumped to ${NEW_VERSION}"

      - name: Install vsce (pinned)
        run: npm install -g @vscode/vsce@2.27.0

      - name: Package and validate extension
        run: vsce package

      - name: Publish to Marketplace
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: vsce publish --pat "$VSCE_TOKEN"

      - name: Push release commit and tag
        run: |
          git push origin HEAD:main
          git push origin "v${NEW_VERSION}"
